<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | PraktikMath</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #231F20;
      }
      /* Canvas mengisi seluruh iframe / layar fullscreen */
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #231F20;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #ffffff;
        font-family: sans-serif;
        font-size: 14px;
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">Loading... <span id="unity-progress">0</span>%</div>

    <script src="PraktikMath v7.0.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressText = document.querySelector("#unity-progress");

      var config = {
        arguments: [],
        dataUrl: "PraktikMath v7.0.data.br",
        frameworkUrl: "PraktikMath v7.0.framework.js.br",
        codeUrl: "PraktikMath v7.0.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Leanst",
        productName: "PraktikMath",
        productVersion: "7.0",
        // Biarkan drawing buffer mengikuti ukuran CSS canvas (responsif)
        matchWebGLToCanvasSize: true,
      };

      loadingBar.style.display = "block";

      createUnityInstance(canvas, config, function (progress) {
        progressText.innerHTML = Math.round(100 * progress);
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
