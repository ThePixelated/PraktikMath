<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: {{{ SPLASH_SCREEN_STYLE == 'Dark' ? '#231F20' : 'white' }}};
      }
      /* Canvas mengisi seluruh iframe / layar fullscreen */
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: {{{ BACKGROUND_FILENAME ? 'url(\'' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : SPLASH_SCREEN_STYLE == 'Dark' ? '#231F20' : 'white' }}};
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: {{{ SPLASH_SCREEN_STYLE == 'Dark' ? '#ffffff' : '#000000' }}};
        font-family: sans-serif;
        font-size: 14px;
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">Loading... <span id="unity-progress">0</span>%</div>

    <script src="{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressText = document.querySelector("#unity-progress");

      var config = {
        arguments: [],
        dataUrl: "{{{ DATA_FILENAME }}}",
        frameworkUrl: "{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: "{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        // Biarkan drawing buffer mengikuti ukuran CSS canvas (responsif)
        matchWebGLToCanvasSize: true,
      };

      loadingBar.style.display = "block";

      createUnityInstance(canvas, config, function (progress) {
        progressText.innerHTML = Math.round(100 * progress);
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
